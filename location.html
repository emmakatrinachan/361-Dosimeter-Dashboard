```html
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Phone Location Uploader</title>

  <style>
    :root {
      --ink: #142022;
      --muted: #627073;
      --line: #d7e0df;
      --page: #f5f7f7;
      --panel: #ffffff;
      --accent: #0b7664;
      --warn: #a15c00;
      --bad: #b3261e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--page);
      color: var(--ink);
    }

    main {
      width: min(720px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 20px 0;
    }

    header {
      border-bottom: 1px solid var(--line);
      padding-bottom: 14px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 1.8rem;
    }

    p {
      color: var(--muted);
      line-height: 1.45;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }

    label {
      display: block;
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      font: inherit;
      margin-bottom: 10px;
    }

    button {
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: white;
      padding: 10px 12px;
      font: inherit;
      cursor: pointer;
      margin-right: 8px;
      margin-bottom: 8px;
    }

    button.secondary {
      background: #e6eceb;
      color: var(--ink);
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .metric {
      border-top: 1px solid var(--line);
      padding-top: 10px;
    }

    .metric b {
      display: block;
      font-size: 1.35rem;
      overflow-wrap: anywhere;
    }

    .ok {
      color: var(--accent);
    }

    .warn {
      color: var(--warn);
    }

    .bad {
      color: var(--bad);
    }

    @media (max-width: 620px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>Phone Location Uploader</h1>

      <p>
        Keep this page open while recording. It sends your phone's GPS
        coordinates to the same ThingSpeak channel as the ESP32 sensor
        readings.
      </p>
    </header>

    <section class="panel">
      <label for="writeKey">ThingSpeak Write API Key</label>

      <input
        id="writeKey"
        type="password"
        placeholder="Paste Write API Key"
        autocomplete="off"
      >

      <label for="deviceLabel">Device Label</label>

      <input
        id="deviceLabel"
        value="esp32-aht20-001"
      >

      <button id="start" type="button">
        Start Tracking
      </button>

      <button
        id="stop"
        class="secondary"
        type="button"
      >
        Stop Tracking
      </button>

      <p id="status" class="warn">
        Idle. Location permission has not been requested yet.
      </p>
    </section>

    <section class="panel grid">
      <div class="metric">
        <label>Latitude</label>
        <b id="lat">--</b>
      </div>

      <div class="metric">
        <label>Longitude</label>
        <b id="lon">--</b>
      </div>

      <div class="metric">
        <label>Accuracy</label>
        <b id="accuracy">--</b>
      </div>

      <div class="metric">
        <label>Last Upload</label>
        <b id="lastUpload">--</b>
      </div>
    </section>
  </main>

  <script>
    const writeKeyInput =
      document.getElementById("writeKey");

    const deviceLabelInput =
      document.getElementById("deviceLabel");

    const statusEl =
      document.getElementById("status");

    const latEl =
      document.getElementById("lat");

    const lonEl =
      document.getElementById("lon");

    const accuracyEl =
      document.getElementById("accuracy");

    const lastUploadEl =
      document.getElementById("lastUpload");

    const startButton =
      document.getElementById("start");

    const stopButton =
      document.getElementById("stop");

    // Upload the latest phone location every 30 seconds.
    const UPLOAD_INTERVAL_MS = 30000;

    let watchId = null;
    let uploadTimer = null;
    let latestPosition = null;
    let isUploading = false;
    let firstUploadSent = false;

    function setStatus(text, className = "") {
      statusEl.textContent = text;
      statusEl.className = className;
    }

    function saveSettings() {
      localStorage.setItem(
        "thingspeakWriteKey",
        writeKeyInput.value.trim()
      );

      localStorage.setItem(
        "deviceLabel",
        deviceLabelInput.value.trim()
      );
    }

    function loadSettings() {
      writeKeyInput.value =
        localStorage.getItem("thingspeakWriteKey") || "";

      deviceLabelInput.value =
        localStorage.getItem("deviceLabel") ||
        "esp32-aht20-001";
    }

    function updatePositionUi(position) {
      const coords = position.coords;

      latEl.textContent =
        coords.latitude.toFixed(6);

      lonEl.textContent =
        coords.longitude.toFixed(6);

      accuracyEl.textContent =
        Math.round(coords.accuracy) + " m";
    }

    async function sendLocation() {
      if (isUploading) {
        return;
      }

      saveSettings();

      const writeKey =
        writeKeyInput.value.trim();

      const deviceLabel =
        deviceLabelInput.value.trim() ||
        "esp32-aht20-001";

      if (!writeKey) {
        setStatus(
          "Paste your ThingSpeak Write API Key first.",
          "bad"
        );

        return;
      }

      if (!latestPosition) {
        setStatus(
          "Waiting for the first GPS fix.",
          "warn"
        );

        return;
      }

      isUploading = true;

      const coords =
        latestPosition.coords;

      const params =
        new URLSearchParams({
          api_key: writeKey,
          field3: String(
            Math.round(coords.accuracy)
          ),
          lat: coords.latitude.toFixed(6),
          long: coords.longitude.toFixed(6),
          status:
            deviceLabel + " phone-location"
        });

      const url =
        "https://api.thingspeak.com/update?" +
        params.toString();

      try {
        /*
          no-cors prevents the browser from reading the
          ThingSpeak response, but the request is still sent.
        */
        await fetch(url, {
          method: "GET",
          mode: "no-cors",
          cache: "no-store"
        });

        lastUploadEl.textContent =
          new Date().toLocaleTimeString();

        setStatus(
          "Location sent. Next upload in about 30 seconds.",
          "ok"
        );
      } catch (error) {
        console.error(
          "Location upload failed:",
          error
        );

        setStatus(
          "Could not send location. Check your internet connection.",
          "bad"
        );
      } finally {
        isUploading = false;
      }
    }

    function handlePosition(position) {
      latestPosition = position;

      updatePositionUi(position);

      setStatus(
        "Tracking location. Keep this page open and the screen awake.",
        "ok"
      );

      /*
        Send the first upload immediately after the first
        successful GPS position is received.
      */
      if (!firstUploadSent) {
        firstUploadSent = true;
        sendLocation();
      }
    }

    function handleLocationError(error) {
      let message =
        "Could not access location.";

      if (error.code === 1) {
        message =
          "Location permission was denied. Allow location access and try again.";
      } else if (error.code === 2) {
        message =
          "Your phone could not determine its location.";
      } else if (error.code === 3) {
        message =
          "Location request timed out. Try moving outdoors.";
      }

      setStatus(message, "bad");
    }

    function startTracking() {
      saveSettings();

      const writeKey =
        writeKeyInput.value.trim();

      if (!writeKey) {
        setStatus(
          "Paste your ThingSpeak Write API Key first.",
          "bad"
        );

        return;
      }

      if (!navigator.geolocation) {
        setStatus(
          "This browser does not support geolocation.",
          "bad"
        );

        return;
      }

      stopTracking(false);

      latestPosition = null;
      firstUploadSent = false;

      startButton.disabled = true;

      setStatus(
        "Requesting location permission...",
        "warn"
      );

      watchId =
        navigator.geolocation.watchPosition(
          handlePosition,
          handleLocationError,
          {
            enableHighAccuracy: true,
            maximumAge: 5000,
            timeout: 20000
          }
        );

      uploadTimer =
        setInterval(
          sendLocation,
          UPLOAD_INTERVAL_MS
        );
    }

    function stopTracking(
      showMessage = true
    ) {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(
          watchId
        );
      }

      if (uploadTimer !== null) {
        clearInterval(uploadTimer);
      }

      watchId = null;
      uploadTimer = null;
      latestPosition = null;
      firstUploadSent = false;
      isUploading = false;

      startButton.disabled = false;

      if (showMessage) {
        setStatus(
          "Tracking stopped.",
          "warn"
        );
      }
    }

    startButton.addEventListener(
      "click",
      startTracking
    );

    stopButton.addEventListener(
      "click",
      () => stopTracking(true)
    );

    window.addEventListener(
      "beforeunload",
      () => stopTracking(false)
    );

    loadSettings();
  </script>
</body>
</html>
